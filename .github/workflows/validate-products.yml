name: Validate ValueRadar catalogue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and build product pages
        run: python scripts/build_products.py
      - name: Confirm generated catalogue
        run: |
          test -f sitemap.xml
          test -f products/atom-aliston-sf400-kitchen-scale/index.html
          test -f products/agaro-elite-rechargeable-mini-chopper-250ml/index.html
          test -f products/nova-blue-electric-egg-boiler-nec-1530/index.html
          test -f products/prestige-pgmfb-grill-sandwich-maker/index.html
          grep -q 'Tracked reference price' products/atom-aliston-sf400-kitchen-scale/index.html
          grep -q 'Marketplace price observed' products/agaro-elite-rechargeable-mini-chopper-250ml/index.html
